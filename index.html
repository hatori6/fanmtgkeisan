<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<h1 class="page-title">ファンミ2026グッズ計算シート</h1>

<style>
.page-title {
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  margin: 20px 0;
  color: #ff7a00;
}

/* クリアボタン */
.clear-box {
  text-align: right;
  margin: -10px 0 20px;
}

#clearBtn {
  background: #ffeb3b;
  color: #000;
  border: none;
  padding: 16px 30px;
  font-size: 24px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  box-shadow: 0 3px 6px rgba(0,0,0,0.25);
}

#clearBtn:hover {
  background: #f5d400;
}

/* 全体 */
body {
  font-family: "Helvetica", "Arial", sans-serif;
  background: #2f6fe4;
  padding: 20px;
  max-width: 680px;   /* ← PCもスマホも余裕の幅 */
  margin: auto;
  padding-bottom: 240px; /* ← 下部余白を大きく追加！ */
}

/* グッズ枠（さらに広くした） */
.item {
  background: #fff;
  padding: 32px;       /* ← かなり広くした！ */
  border-radius: 16px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  margin-bottom: 24px;
  border-left: 6px solid #ff7a00;
}

/* ラベル文字大きく */
label {
  font-size: 28px;
  font-weight: bold;
  display: block;
  margin-bottom: 14px;
}

/* プルダウン大きく */
select {
  width: 100%;
  padding: 18px;
  border-radius: 10px;
  border: 2px solid #ff7a00;
  font-size: 24px;
  background: #fff;
}

/* ★★★ 2列レイアウト（PCもスマホも2列固定） ★★★ */
.items-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;           /* ← gap を調整して幅を確保 */
}

/* スマホで幅がギリギリにならないように調整 */
@media (max-width: 480px) {
  .items-wrapper {
    gap: 16px;         /* ← スマホは少し gap を減らす */
  }
}

/* 合計金額バー（特大） */
.total-box {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #ff7a00;
  color: #fff;
  padding: 42px;       /* ← 縦幅さらに広く */
  font-size: 54px;     /* ← 文字さらに大きく */
  font-weight: bold;
  text-align: center;
  line-height: 1.4;
}
</style>
</head>

<body>

<div class="clear-box">
  <button id="clearBtn">選択をクリア</button>
</div>

<div class="items-wrapper">

  <div class="item">
    <label>BIG シルエットスウェット ￥8900 ※1会計5点まで</label>
    <select id="sw">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>アクリルスタンドA ￥1800 ※1会計5点まで</label>
    <select id="asA">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>アクリルスタンドB ￥1800 ※1会計5点まで</label>
    <select id="asB">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>メッシュトートバッグ ￥3000 ※1会計5点まで</label>
    <select id="tote">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>メッシュポーチ ￥2000 ※1会計5点まで</label>
    <select id="pouch">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>ステッカーセット ￥1500 ※1会計5点まで</label>
    <select id="sticker">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>ハンドタオル（オレンジ） ￥1500 ※1会計5点まで</label>
    <select id="towelO">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>ハンドタオル（グリーン） ￥1500 ※1会計5点まで</label>
    <select id="towelG">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>クリアカード（ランダム全12種） ￥500 ※1会計24点まで</label>
    <select id="card">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
      <option value="6">6</option><option value="7">7</option>
      <option value="8">8</option><option value="9">9</option>
      <option value="10">10</option><option value="11">11</option>
      <option value="12">12</option><option value="13">13</option>
      <option value="14">14</option><option value="15">15</option>
      <option value="16">16</option><option value="17">17</option>
      <option value="18">18</option><option value="19">19</option>
      <option value="20">20</option><option value="21">21</option>
      <option value="22">22</option><option value="23">23</option>
      <option value="24">24</option>
    </select>
  </div>

  <div class="item">
    <label>ガチャ（ランダム全11種） ￥800 ※1会計22点まで</label>
    <select id="gacha">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
      <option value="6">6</option><option value="7">7</option>
      <option value="8">8</option><option value="9">9</option>
      <option value="10">10</option><option value="11">11</option>
      <option value="12">12</option><option value="13">13</option>
      <option value="14">14</option><option value="15">15</option>
      <option value="16">16</option><option value="17">17</option>
      <option value="18">18</option><option value="19">19</option>
      <option value="20">20</option><option value="21">21</option>
      <option value="22">22</option>
    </select>
  </div>

</div>

<div class="total-box">
  合計金額：<span id="total">0</span> 円
</div>

<script>
function calc() {
  const sw = document.getElementById('sw').value * 8900;
  const asA = document.getElementById('asA').value * 1800;
  const asB = document.getElementById('asB').value * 1800;
  const tote = document.getElementById('tote').value * 3000;
  const pouch = document.getElementById('pouch').value * 2000;
  const sticker = document.getElementById('sticker').value * 1500;
  const towelO = document.getElementById('towelO').value * 1500;
  const towelG = document.getElementById('towelG').value * 1500;
  const card = document.getElementById('card').value * 500;
  const gacha = document.getElementById('gacha').value * 800;

  const total = sw + asA + asB + tote + pouch + sticker + towelO + towelG + card + gacha;

  document.getElementById('total').innerText = total.toLocaleString();
}

document.querySelectorAll('select').forEach(sel => {
  sel.addEventListener('change', calc);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  document.querySelectorAll('select').forEach(sel => sel.value = "0");
  calc();
});
</script>

</body>
</html>
