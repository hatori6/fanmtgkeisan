<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<h1 class="page-title">ファンミ2026グッズ計算シート</h1>

<style>
.page-title {
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  margin: 20px 0;
  color: #ff7a00;
}

/* 合計金額＋クリアボタン */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

#topTotal {
  font-size: 32px;
  font-weight: bold;
  color: #fff;
  background: #ff7a00;
  padding: 18px 26px;
  border-radius: 12px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.25);
}

#clearBtn {
  background: #ffeb3b;
  color: #000;
  border: none;
  padding: 16px 30px;
  font-size: 24px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  box-shadow: 0 3px 6px rgba(0,0,0,0.25);
}

#clearBtn:hover {
  background: #f5d400;
}

/* 全体 */
body {
  font-family: "Helvetica", "Arial", sans-serif;
  background: #2f6fe4;
  padding: 20px;
  max-width: 760px;   /* ← 横幅さらに広げた！ */
  margin: auto;
  padding-bottom: 200px;
}

/* グッズ枠（横幅広めに最適化） */
.item {
  background: #fff;
  padding: 26px;       /* ← 縦が広がりすぎないように調整 */
  border-radius: 16px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  margin-bottom: 20px;
  border-left: 6px solid #ff7a00;
  word-break: break-word;
}

/* ラベル文字 */
label {
  font-size: 26px;
  font-weight: bold;
  display: block;
  line-height: 1.5;
  margin-bottom: 12px;
}

/* プルダウン */
select {
  width: 100%;
  padding: 16px;
  border-radius: 10px;
  border: 2px solid #ff7a00;
  font-size: 22px;
  background: #fff;
}

/* 2列レイアウト（横幅広げるため gap を調整） */
.items-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;   /* ← 横幅確保のためさらに狭めた */
}

@media (max-width: 480px) {
  .items-wrapper {
    gap: 10px;
  }
}
</style>
</head>

<body>

<div class="top-bar">
  <div id="topTotal">合計：0 円</div>
  <button id="clearBtn">選択をクリア</button>
</div>

<div class="items-wrapper">

  <div class="item">
    <label>BIG シルエットスウェット ￥8900<br>※1会計につき 5点までの条件</label>
    <select id="sw">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>アクリルスタンドA ￥1800<br>※1会計につき 5点までの条件</label>
    <select id="asA">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>アクリルスタンドB ￥1800<br>※1会計につき 5点までの条件</label>
    <select id="asB">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>メッシュトートバッグ ￥3000<br>※1会計につき 5点までの条件</label>
    <select id="tote">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>メッシュポーチ ￥2000<br>※1会計につき 5点までの条件</label>
    <select id="pouch">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>ステッカーセット ￥1500<br>※1会計につき 5点までの条件</label>
    <select id="sticker">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>ハンドタオル（オレンジ） ￥1500<br>※1会計につき 5点までの条件</label>
    <select id="towelO">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>ハンドタオル（グリーン） ￥1500<br>※1会計につき 5点までの条件</label>
    <select id="towelG">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
  </div>

  <div class="item">
    <label>クリアカード（ランダム全12種） ￥500<br>※1会計につき 24点までの条件</label>
    <select id="card">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
      <option value="6">6</option><option value="7">7</option>
      <option value="8">8</option><option value="9">9</option>
      <option value="10">10</option><option value="11">11</option>
      <option value="12">12</option><option value="13">13</option>
      <option value="14">14</option><option value="15">15</option>
      <option value="16">16</option><option value="17">17</option>
      <option value="18">18</option><option value="19">19</option>
      <option value="20">20</option><option value="21">21</option>
      <option value="22">22</option><option value="23">23</option>
      <option value="24">24</option>
    </select>
  </div>

  <div class="item">
    <label>ガチャ（ランダム全11種） ￥800<br>※1会計につき 22点までの条件</label>
    <select id="gacha">
      <option value="0">0</option><option value="1">1</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
      <option value="6">6</option><option value="7">7</option>
      <option value="8">8</option><option value="9">9</option>
      <option value="10">10</option><option value="11">11</option>
      <option value="12">12</option><option value="13">13</option>
      <option value="14">14</option><option value="15">15</option>
      <option value="16">16</option><option value="17">17</option>
      <option value="18">18</option><option value="19">19</option>
      <option value="20">20</option><option value="21">21</option>
      <option value="22">22</option>
    </select>
  </div>

</div>

<script>
function calc() {
  const sw = document.getElementById('sw').value * 8900;
  const asA = document.getElementById('asA').value * 1800;
  const asB = document.getElementById('asB').value * 1800;
  const tote = document.getElementById('tote').value * 3000;
  const pouch = document.getElementById('pouch').value * 2000;
  const sticker = document.getElementById('sticker').value * 1500;
  const towelO = document.getElementById('towelO').value * 1500;
  const towelG = document.getElementById('towelG').value * 1500;
  const card = document.getElementById('card').value * 500;
  const gacha = document.getElementById('gacha').value * 800;

  const total = sw + asA + asB + tote + pouch + sticker + towelO + towelG + card + gacha;

  document.getElementById('topTotal').innerText = "合計：" + total.toLocaleString() + " 円";
}

document.querySelectorAll('select').forEach(sel => {
  sel.addEventListener('change', calc);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  document.querySelectorAll('select').forEach(sel => sel.value = "0");
  calc();
});
</script>

</body>
</html>
