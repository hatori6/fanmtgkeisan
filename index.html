<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<h1 class="page-title">ファンミ2026グッズ計算シート</h1>

<style>
.page-title {
  font-size: 40px;       
  font-weight: bold;     
  text-align: center;    
  margin: 20px 0;        
  color: #ff7a00;          
}

@media (max-width: 600px) {
  .page-title {
    font-size: 48px;   
    margin: 24px 0;
  }
}

.clear-box {
  text-align: right;
  margin: -10px 0 20px;
}

#clearBtn {
  background: #ffeb3b;
  color: #000;
  border: none;
  padding: 14px 26px;
  font-size: 22px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  box-shadow: 0 3px 6px rgba(0,0,0,0.25);
}

#clearBtn:hover {
  background: #f5d400;
}

body {
  font-family: "Helvetica", "Arial", sans-serif;
  background: #2f6fe4;
  padding: 20px;
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
  color: #ff7a00;
}

.item {
  background: #fff;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  margin-bottom: 20px;
  border-left: 6px solid #ff7a00;
}

label {
  font-size: 22px;
  font-weight: bold;
  display: block;
  margin-bottom: 8px;
}

select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 2px solid #ff7a00;
  font-size: 16px;
  background: #fff;
}

@media (min-width: 601px) {
  body {
    padding-bottom: 120px;
  }
} /* ← ここ閉じた！ */

.total-box {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #ff7a00;
  color: #fff;
  padding: 20px;
  font-size: 35px;
  font-weight: bold;
  text-align: center;
}

@media (max-width: 600px) {
  .total-box {
    font-size: 40px !important;
    padding: 28px;
    line-height: 1.4;
    min-height: 70px;
  }
}

</style>
</head>

<body>

<div class="clear-box">
  <button id="clearBtn">選択をクリア</button>
</div>

<!-- ★★★ ここに items-wrapper を置く ★★★ -->
<div class="items-wrapper">

  <!-- ここに全部の item を入れる（今ある item を丸ごと移動） -->

  <div class="item">
    <label>BIG シルエットスウェット ￥8900 ※1会計5点まで</label>
    <select id="sw">…</select>
  </div>

  <div class="item">
    <label>アクリルスタンドA ￥1800 ※1会計5点まで</label>
    <select id="asA">…</select>
  </div>

  <div class="item">
    <label>アクリルスタンドB ￥1800 ※1会計5点まで</label>
    <select id="asB">…</select>
  </div>

  <div class="item">
    <label>メッシュトートバッグ ￥3000 ※1会計5点まで</label>
    <select id="tote">…</select>
  </div>

  <div class="item">
    <label>メッシュポーチ ￥2000 ※1会計5点まで</label>
    <select id="pouch">…</select>
  </div>

  <div class="item">
    <label>ステッカーセット ￥1500 ※1会計5点まで</label>
    <select id="sticker">…</select>
  </div>

  <div class="item">
    <label>ハンドタオル（オレンジ） ￥1500 ※1会計5点まで</label>
    <select id="towelO">…</select>
  </div>

  <div class="item">
    <label>ハンドタオル（グリーン） ￥1500 ※1会計5点まで</label>
    <select id="towelG">…</select>
  </div>

  <div class="item">
    <label>クリアカード ￥500 ※1会計24点まで</label>
    <select id="card">…</select>
  </div>

  <div class="item">
    <label>ガチャ ￥800 ※1会計22点まで</label>
    <select id="gacha">…</select>
  </div>

</div>
<!-- ★★★ items-wrapper はここまで ★★★ -->


<div class="total-box">
  合計金額：<span id="total">0</span> 円
</div>

</body>
</html>
